<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.top{display:flex;gap:16px;margin-bottom:0}
.rl{flex:1;background:#fff;border-radius:16px;padding:18px 20px;border:2px solid #CBD5E1}
.rl.g{border-color:var(--olive)}
.rl .k{font-size:14px;font-weight:800;color:var(--sub)}
.rl.g .k{color:var(--olive)}
.rl .v{font-size:23px;font-weight:900;margin:4px 0 6px}
.rl .d{font-size:14.5px;color:var(--sub);line-height:1.65;word-break:auto-phrase}
.mid{display:flex;justify-content:space-around;padding:8px 0;font-size:15px;font-weight:700;color:var(--sub)}
.mid span{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.mid i{font-style:normal;font-size:22px;color:#94A3B8}
.base{background:var(--olive-l);border:2px solid var(--olive);border-radius:16px;padding:16px 20px;text-align:center}
.base .k{font-size:14px;font-weight:800;color:var(--olive)}
.base .v{font-size:23px;font-weight:900;margin:4px 0 4px}
.base .d{font-size:14.5px;color:var(--sub);line-height:1.65}
</style></head><body><div class="stage">
<div class="cap">AIは、役割ごとに分けて選ぶ<small>資料はGoogleに置き、仕事の中身に合わせてAIを使い分けます</small></div>
<div class="top">
 <div class="rl">
  <div class="k">分析や相談の相手</div>
  <div class="v">ChatGPT、Claude</div>
  <div class="d">あいまいな頼み方でも、意図をくんで深く考えてくれる</div>
 </div>
 <div class="rl g">
  <div class="k">アプリに組み込むAI</div>
  <div class="v">Gemini の小さいモデル</div>
  <div class="d">決まった仕事を、同じ品質で、手頃な費用でくり返す</div>
 </div>
</div>
<div class="mid"><span><i>▲</i>資料を渡す</span><span><i>▲</i>資料を渡す</span></div>
<div class="base">
 <div class="k">資料の置き場所</div>
 <div class="v">Google Workspace</div>
 <div class="d">メール・書類・表を、どのAIにも渡せる形に整えておく</div>
</div>
</div></body></html>

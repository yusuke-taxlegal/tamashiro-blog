<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.cols{display:flex;gap:16px}
.col{flex:1;background:#fff;border-radius:16px;padding:18px 20px 20px;border-top:8px solid #94A3B8}
.col.app{border-top-color:var(--olive)}
.col h3{font-size:20px;font-weight:900;margin-bottom:4px}
.col .who{font-size:14px;color:var(--sub);margin-bottom:14px}
.flow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.bx{flex:1;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:14.5px;font-weight:700;line-height:1.45;word-break:auto-phrase}
.col.app .bx.ai{background:var(--olive-l);border-color:var(--olive);color:var(--olive)}
.col.chat .bx.ai{background:#E2E8F0;border-color:#94A3B8}
.aw{flex:none;font-size:20px;color:#94A3B8;font-weight:800}
.pt{font-size:14.5px;line-height:1.75;color:var(--ink);word-break:auto-phrase}
.pt b{display:inline-block;min-width:74px;color:var(--sub);font-weight:700}
.goal{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:16px;font-weight:800;text-align:center}
.col.chat .goal{background:#E2E8F0}
.col.app .goal{background:var(--olive-l);color:var(--olive)}
</style></head><body><div class="stage">
<div class="cap">同じAIでも、使う場面で求めるものが変わる<small>会話で使うときと、アプリに組み込むときの違い</small></div>
<div class="cols">
 <div class="col chat">
  <h3>会話で使うAI</h3>
  <div class="who">自分がその場で読み、聞き直せる</div>
  <div class="flow"><div class="bx">自分が頼む</div><div class="aw">⇄</div><div class="bx ai">AI</div></div>
  <div class="pt"><b>頼む内容</b>毎回違う。あいまいなことも多い</div>
  <div class="pt"><b>費用</b>月額の定額が中心</div>
  <div class="goal">求めるのは、深い答え</div>
 </div>
 <div class="col app">
  <h3>アプリに組み込むAI</h3>
  <div class="who">使う人は、結果をそのまま受け取る</div>
  <div class="flow"><div class="bx">使う人</div><div class="aw">▶</div><div class="bx">アプリ</div><div class="aw">▶</div><div class="bx ai">AI</div></div>
  <div class="pt"><b>頼む内容</b>毎回同じ。指示は作り手が決めておく</div>
  <div class="pt"><b>費用</b>使った分だけ払う</div>
  <div class="goal">求めるのは、いつも同じ品質</div>
 </div>
</div>
</div></body></html>
